name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.backend
          push: true
          tags: |
            vinod057/bookmyscreen-backend:latest
            vinod057/bookmyscreen-backend:${{ github.sha }}
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.frontend
          push: true
          tags: |
            vinod057/bookmyscreen-frontend:latest
            vinod057/bookmyscreen-frontend:${{ github.sha }}

  deploy:
    needs:
      - build-backend
      - build-frontend

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/bookmyscreen

            docker compose stop backend
            docker rm -f backend
            docker rmi vinod057/bookmyscreen-backend:latest

            docker compose stop frontend
            docker rm -f frontend
            docker rmi vinod057/bookmyscreen-frontend:latest

            docker system prune --all --force
            docker image prune -a -f

            docker compose pull

            docker compose up -d

            docker compose exec -T backend pnpm run db:migrate

            docker image prune -f
