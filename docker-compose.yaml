services:
  postgres:
    image: postgres:16-alpine
    container_name: docker-postgres
    ports:
      - 5433:5432
    environment:
      - POSTGRES_PASSWORD=mydbpass
      - POSTGRES_DB=mydockerdb
    networks:
      - monorepo-network
    volumes:
      - monorepo-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_container
    restart: always

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - monorepo-network

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        DATABASE_URL: postgresql://postgres:mydbpass@postgres:5432/mydockerdb
    container_name: backend-container
    ports:
      - 4000:3000
    env_file:
      - apps/backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:mydbpass@postgres:5432/mydockerdb
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
      - ACCESS_TOKEN_SECRET=docker-access-token-secret
      - REFRESH_TOKEN_SECRET=docker-refresh-token-secret
      - HASHING_SECRET=docker-hashing-secret
      - RAZORPAY_KEY_ID=rzp_test_T2mSgB5NaDc7Mi
      - RAZORPAY_KEY_SECRET=jKOaZaSjxzyyEG61SF4UtdrK
      - RAZORPAY_WEBHOOK_SECRET=docker-razorpay-webhook-placeholder
    networks:
      - monorepo-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_BACKEND_URL: http://localhost:4000/api/v1
        VITE_RAZORPAY_KEY_ID: rzp_test_T2mSgB5NaDc7Mi
    container_name: frontend-container
    command: sh -c "cd apps/frontend && pnpm exec vite preview --host 0.0.0.0 --port 3000"
    ports:
      - 3000:3000
    environment:
      - NODE_ENV=production
      - VITE_RAZORPAY_KEY_ID=rzp_test_T2mSgB5NaDc7Mi
    networks:
      - monorepo-network
    depends_on:
      backend:
        condition: service_started

networks:
  monorepo-network:

volumes:
  monorepo-volume:
